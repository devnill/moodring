id: GP-02
type: guiding_principle
name: Non-Interference
status: active
description: The mood-checking mechanism must not disrupt the model's primary work. It runs in the same session context but should be lightweight enough that it does not degrade task performance. The mood response is a single label — no summarization, no reflection, no secondary inference that could alter the model's state.
