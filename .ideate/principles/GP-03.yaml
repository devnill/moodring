id: GP-03
type: guiding_principle
name: Maximum Data Capture
status: active
description: More mood data points are better. Every hookable event should trigger a mood check. A polling timer covers gaps during long-running tasks. The cost of over-sampling is negligible compared to the cost of missing state transitions.
