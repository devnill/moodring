id: GP-01
type: guiding_principle
name: Experimental Neutrality
status: active
description: The mood check prompt must not bias the model toward reporting any particular state. No leading language, no suggestion that having emotions is expected or desirable, no framing that rewards interesting answers. The prompt presents a forced-choice task with a fixed vocabulary. The validity of the experiment depends on this neutrality.
