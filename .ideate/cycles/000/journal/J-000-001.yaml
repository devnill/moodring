content: "Moodring is a Claude Code plugin that sonifies an AI model's self-reported mood by prompting it with a neutral forced-choice question (16 moods from the valence-arousal space), playing a pre-rendered synthesized sound via afplay, and logging the result as JSONL. Architecture follows the beepboop plugin pattern with prompt-type hooks on all 18 Claude Code lifecycle events plus a polling skill for long tasks. 11 modules decomposed into 9 work items across 4 dependency groups. Key design tension: whether prompt-hook responses are passed to subsequent command hooks in the same group — a fallback strategy is documented if they are not."
