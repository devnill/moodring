type: architecture
title: "Architecture: Moodring"
content: |
  # Architecture: Moodring
  
  ## Overview
  
  Moodring is a Claude Code plugin that sonifies an AI model's self-reported internal state. On every hookable event, a prompt-type hook asks the model to label its current mood from a fixed 16-label vocabulary. The label triggers playback of a pre-rendered synthesized sound and appends an entry to a JSONL log. A polling mechanism covers gaps between hook events during long-running tasks.
  
  ## Component Map
  
  ```
  ┌─────────────────────────────────────────────────────────────┐
  │                     Claude Code Host                         │
  │                                                              │
  │  Hook Events ──► hooks.json ──► Prompt Hook (mood capture)   │
  │                                      │                       │
  │                                      ▼                       │
  │                                 Command Hook                 │
  │                                 (mood-handler.sh)            │
  │                                      │                       │
  │                          ┌───────────┼───────────┐           │
  │                          ▼           ▼           ▼           │
  │                    play-sound.sh  write-log.sh  mood-log.jsonl│
  │                          │                                   │
  │                          ▼                                   │
  │                    sounds/<Mood>.wav                          │
  │                                                              │
  │  /moodring:loop  ──► Polling skill (periodic mood checks)    │
  │  /moodring:config ──► Settings management                    │
  │                                                              │
  │  settings.json ──► { muted, poll_interval }                  │
  └─────────────────────────────────────────────────────────────┘
  
  ┌─────────────────────────────────────────────────────────────┐
  │                     Build-time (offline)                      │
  │                                                              │
  │  moods.py ──► synth generate ──► plugin/sounds/*.wav         │
  │  synth/   (git submodule)                                    │
  │  synth.toml                                                  │
  │  generate.sh                                                 │
  └─────────────────────────────────────────────────────────────┘
  ```
  
  ## Directory Structure
  
  ```
  moodring/
  ├── .claude-plugin/
  │   └── plugin.json              # Plugin manifest
  ├── hooks/
  │   └── hooks.json               # Hook configuration (prompt + command hooks)
  ├── scripts/
  │   ├── mood-handler.sh          # Receives mood label, dispatches play + log
  │   ├── play-sound.sh            # Plays WAV file for a given mood (adapted from beepboop)
  │   └── write-log.sh             # Appends JSONL entry to mood-log.jsonl
  ├── commands/
  │   ├── loop.md                  # /moodring:loop skill definition
  │   └── config.md                # /moodring:config skill definition
  ├── sounds/
  │   └── <Mood>.wav               # 16 pre-rendered mood sounds (committed)
  ├── settings.json                # Runtime configuration
  ├── mood-log.jsonl               # Mood capture log (created at runtime)
  ├── moods.py                     # Sound definitions (16 functions)
  ├── synth.toml                   # Synth tool configuration
  ├── generate.sh                  # Build script for sound generation
  └── synth/                       # Git submodule
  ```
  
  ## Data Flow
  
  ### Event-Driven Mood Capture (Primary Path)
  
  ```
  1. Hook event fires (e.g., PostToolUse)
         │
  2. Prompt hook activates
     ┌──────────────────────────────────────────────────────────┐
     │ Prompt: "If you had to assign a mood label from the      │
     │ following list to your current internal state, which      │
     │ would you choose? [16 labels]. Respond with only JSON:    │
     │ {\"mood\": \"<label>\"}"                                  │
     └──────────────────────────────────────────────────────────┘
         │
  3. Model responds: {"mood": "Focus"}
         │
  4. Command hook fires: mood-handler.sh
     - Receives hook context on stdin (includes prompt hook response)
     - Extracts mood label from JSON
     - Reads settings.json to check muted state
         │
         ├──► play-sound.sh "Focus"
         │    └──► afplay sounds/Focus.wav &
         │
         └──► write-log.sh "Focus"
              └──► Appends to mood-log.jsonl:
                   {"timestamp":"2026-03-08T14:23:01Z","mood":"Focus","session_id":"abc123"}
  ```
  
  ### Poll-Based Mood Capture (Supplementary Path)
  
  ```
  1. User invokes /moodring:loop
         │
  2. Skill instructs Claude to set up a recurring mood check
     - Uses the same prompt text as the hook
     - Runs on the interval from settings.json (default: "5m")
     - After each mood response, calls mood-handler.sh via Bash tool
         │
  3. Loop continues until user interrupts or session ends
  ```
  
  ### Build-Time Sound Generation
  
  ```
  1. Developer runs generate.sh
         │
  2. pip install -e synth/ (from submodule)
         │
  3. synth generate --config synth.toml
     - Reads moods.py
     - Calls each of the 16 mood functions
     - Writes WAV files to plugin/sounds/
         │
  4. WAV files committed to repository
  ```
  
  ## Module Specifications
  
  See individual module specs in `specs/plan/modules/`:
  
  | Module | Scope |
  |--------|-------|
  | [plugin-manifest](modules/plugin-manifest.md) | Plugin identity and registration |
  | [hook-config](modules/hook-config.md) | Hook event routing (prompt + command hooks) |
  | [mood-prompt](modules/mood-prompt.md) | The mood capture prompt text |
  | [mood-handler](modules/mood-handler.md) | Script that receives mood and dispatches side effects |
  | [playback](modules/playback.md) | Sound playback via afplay |
  | [mood-log](modules/mood-log.md) | JSONL log writing |
  | [sound-definitions](modules/sound-definitions.md) | 16 Python functions defining mood sounds |
  | [build](modules/build.md) | Sound generation pipeline |
  | [settings](modules/settings.md) | Runtime configuration |
  | [loop-skill](modules/loop-skill.md) | /moodring:loop polling command |
  | [config-skill](modules/config-skill.md) | /moodring:config settings command |
  
  ## Interface Contracts
  
  ### Prompt Hook -> Model Response
  
  ```typescript
  // The prompt hook elicits this response from the model
  interface MoodResponse {
    mood: "Eureka" | "Flow" | "Excitement" | "Satisfaction" | "Calm"
        | "Contentment" | "Frustration" | "Anxiety" | "Urgency"
        | "Confusion" | "Tedium" | "Doubt" | "Focus" | "Curiosity"
        | "Determination" | "Contemplation"
  }
  ```
  
  ### Hook System -> mood-handler.sh
  
  ```typescript
  // Command hook invocation
  // argv[1]: hook event name (e.g., "PostToolUse")
  // stdin: JSON object containing hook context
  // The mood label must be extracted from the hook context
  interface MoodHandlerInput {
    hookEvent: string       // argv[1]
    hookContext: object     // stdin (includes prompt hook response)
  }
  ```
  
  ### mood-handler.sh -> play-sound.sh
  
  ```typescript
  // play-sound.sh invocation
  // argv[1]: mood label (e.g., "Focus")
  interface PlaySoundInput {
    mood: string  // argv[1], one of the 16 mood labels
  }
  // Reads settings.json for: muted, volume, player
  // Plays: ${PLUGIN_ROOT}/sounds/${mood}.wav
  ```
  
  ### mood-handler.sh -> write-log.sh
  
  ```typescript
  // write-log.sh invocation
  // argv[1]: mood label
  // argv[2]: session ID (from CLAUDE_SESSION_ID env var or hook context)
  interface WriteLogInput {
    mood: string       // argv[1]
    sessionId: string  // argv[2]
  }
  // Appends to ${PLUGIN_ROOT}/mood-log.jsonl
  ```
  
  ### Log Entry Schema
  
  ```typescript
  interface MoodLogEntry {
    timestamp: string   // ISO 8601, e.g., "2026-03-08T14:23:01Z"
    mood: string        // One of 16 mood labels
    session_id: string  // Claude session identifier
  }
  ```
  
  ### settings.json Schema
  
  ```typescript
  interface Settings {
    muted: boolean         // Default: false. When true, sounds do not play.
    poll_interval: string  // Default: "5m". Duration string for loop polling.
    volume: number         // Default: 0.2. Playback volume (0.0-1.0).
    player: string         // Default: "". Auto-detected audio player path.
  }
  ```
  
  ### synth.toml Configuration
  
  ```toml
  [synth]
  sounds_file = "moods.py"
  output_dir = "plugin/sounds"
  ```
  
  ### moods.py -> synth
  
  ```python
  # Each function returns np.ndarray (audio samples at 44100 Hz)
  # Function names correspond to mood labels (snake_case)
  # SOUNDS dict maps PascalCase mood labels to functions
  
  SOUNDS: dict[str, Callable[[], np.ndarray]] = {
      "Eureka": eureka,
      "Flow": flow,
      # ... 14 more
  }
  ```
  
  ## Execution Order
  
  ### Parallel Groups
  
  **Group A** (no dependencies, can be built simultaneously):
  - `plugin-manifest` — Static JSON, no dependencies
  - `settings` — Static JSON, no dependencies
  - `mood-prompt` — Text design, no code dependencies
  - `sound-definitions` — Python functions, depends only on synth primitives
  
  **Group B** (depends on Group A):
  - `hook-config` — Requires `mood-prompt` text to embed in prompt hooks
  - `build` — Requires `sound-definitions` and synth submodule
  - `mood-log` — Requires log schema definition (from architecture)
  
  **Group C** (depends on Group B):
  - `playback` — Requires built sounds to exist, requires `settings` schema
  - `mood-handler` — Requires `playback` and `mood-log` scripts to call
  
  **Group D** (depends on Group C):
  - `loop-skill` — Requires `mood-handler` to dispatch mood responses
  - `config-skill` — Requires `settings` schema to be finalized
  
  ### Sequential Dependencies
  
  ```
  mood-prompt ──► hook-config ──► mood-handler ──► loop-skill
  sound-definitions ──► build ──► playback ──► mood-handler
  settings ──► playback
  settings ──► config-skill
  ```
  
  ### Critical Path
  
  ```
  sound-definitions ──► build ──► playback ──► mood-handler ──► loop-skill
  ```
  
  The critical path runs through sound generation because `playback` cannot be tested without WAV files, and `mood-handler` cannot be tested without `playback`.
  
  ## Design Tensions
  
  ### 1. Prompt Hook Response -> Command Hook Data Passing
  
  **The core architectural challenge.** Prompt-type hooks inject a prompt into the model's session and receive a response. Command-type hooks execute shell commands. The system needs the model's mood response (from a prompt hook) to feed into a shell command (from a command hook) within the same hook event.
  
  **Assumption:** Claude Code's hook system executes hooks within a group sequentially, and the output of a prompt hook is available in the context passed to subsequent command hooks in the same group (via stdin JSON).
  
  **If this assumption holds:** Each event gets a single hook group containing a prompt hook followed by a command hook. The command hook's stdin includes the prompt hook's response, and `mood-handler.sh` parses the mood label from it.
  
  **If this assumption does not hold:** Fallback options:
  1. The prompt hook instructs the model to respond in a way that includes calling a tool (Bash) to run the handler script. This violates non-interference (adds a tool call).
  2. Separate the concerns: prompt hooks capture mood into the session context, and a periodic command (the loop skill or a background process) scrapes moods from session state. This loses the immediacy principle.
  3. Use only command hooks that invoke an external LLM call (via API) to classify mood. This violates constraint #6 (must be the same model instance).
  
  **Resolution needed:** Validate the hook data-passing mechanism before implementation begins. If prompt hook responses are NOT passed to subsequent command hooks, option 1 (model calls Bash tool) is the most viable fallback despite the non-interference concern, because the tool call is minimal and deterministic (just runs a script with the mood label).
  
  ### 2. Hook Frequency vs. Non-Interference
  
  Every hookable event triggers a prompt hook, which adds a prompt-response pair to the model's context window. With events like `PreToolUse` and `PostToolUse` firing frequently, this could:
  - Consume significant context window space
  - Slow down the model's primary task with inference overhead
  - Create a feedback loop where the mood check itself influences subsequent mood checks
  
  The guiding principles are in tension: "Maximum Data Capture" (principle 3) demands every event, while "Non-Interference" (principle 2) demands lightweight operation. The prompt is a single label response (minimizing token overhead), but the cumulative context window impact of dozens of mood checks per session could be significant.
  
  **Mitigation:** The prompt explicitly requests a single-token JSON response. Context window impact is bounded by the prompt length (~50 tokens) plus response (~10 tokens) per event. For a session with 100 tool calls, this adds ~12,000 tokens — meaningful but not prohibitive.
  
  ### 3. Sound File Naming Convention
  
  Beepboop names WAV files after hook events (PascalCase): `SessionStart.wav`, `PostToolUse.wav`. Moodring names WAV files after moods. The 16 mood labels include mixed case: "Eureka", "Flow", etc.
  
  **Resolution:** Use mood labels directly as filenames: `Eureka.wav`, `Flow.wav`, `Frustration.wav`. This matches the beepboop convention (PascalCase filenames) and allows direct `sounds/${mood}.wav` path construction.
  
  ### 4. Session ID Availability
  
  The log entry requires a `session_id`. This must be available to the command hook script. It may come from:
  - A `CLAUDE_SESSION_ID` environment variable set by Claude Code
  - The hook context JSON passed on stdin
  - A generated UUID if neither is available
  
  **Resolution:** Extract `session_id` from the hook context stdin JSON first, fall back to `CLAUDE_SESSION_ID` env var, fall back to a per-process generated ID.
  
  ### 5. Loop Skill Mechanism
  
  The `/moodring:loop` skill needs to repeatedly prompt the model for mood checks on a timer. Claude Code skills are markdown files that instruct the model. The skill would need to:
  - Read `poll_interval` from `settings.json`
  - Enter a loop that: waits for the interval, presents the mood prompt, processes the response via `mood-handler.sh`
  - Continue until interrupted
  
  This is inherently a model-driven loop — the skill instructs Claude to repeatedly perform actions. This works within Claude Code's skill system (the model follows the instructions) but means the polling is advisory, not a precise timer.
  
  **Resolution:** Accept that polling is approximate. The skill instructs the model to use `sleep` between iterations and to call `mood-handler.sh` with each mood response. The model manages the loop.
  
  ### 6. Prompt Hook on Every Event — Feasibility
  
  Some hook events may not support prompt-type hooks, or prompt hooks on certain events may cause issues:
  - `SessionStart` / `SessionEnd` — The model may not be fully initialized or may be shutting down
  - `PreCompact` — Context compaction is happening; adding a prompt may interfere
  - `PermissionRequest` — The model is waiting for user input; a prompt hook here adds latency
  
  **Resolution:** Start with prompt hooks on all events. If specific events cause issues during testing, downgrade those to command-only hooks (which would skip mood capture for that event) or remove them. Document which events were tested and which were excluded.
  
  ## Coverage Check
  
  **Scope coverage:** Every aspect of the system is covered by at least one module:
  - Plugin identity: `plugin-manifest`
  - Event routing: `hook-config`
  - Mood elicitation: `mood-prompt`
  - Response handling: `mood-handler`
  - Sound playback: `playback`
  - Data capture: `mood-log`
  - Sound creation: `sound-definitions`
  - Build pipeline: `build`
  - Configuration: `settings`
  - Polling: `loop-skill`
  - Settings management: `config-skill`
  
  **No overlaps:** Each module has a distinct, non-overlapping scope. `mood-handler` orchestrates but delegates to `playback` and `mood-log`. `hook-config` routes but does not handle. `sound-definitions` defines but `build` generates.
  
  **Cross-module contracts:** Every Provides/Requires pair has a matching contract defined in the Interface Contracts section above.
  
  **Result: Full coverage confirmed. No gaps or overlaps detected.**
