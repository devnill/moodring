    depends: ["004", "005"]
    blocks: ["007", "008"]
    criteria:
      - 'File `scripts/mood-handler.sh` exists and is executable'
      - 'When stdin contains JSON with a mood label and argv[1] is a hook event name, the script extracts the mood'
      - 'Extracted mood is validated against the 16-label vocabulary; invalid moods cause exit 0'
      - '`play-sound.sh` is called with the mood label (in background)'
      - '`write-log.sh` is called with the mood label and session ID (in foreground)'
      - 'Session ID is extracted from stdin JSON (`session_id` field) or falls back to `"unknown"`'
      - 'Script exits 0 on any error (empty input, malformed JSON, missing mood, invalid mood)'
      - 'Script does not produce stdout/stderr that would pollute hook output'
    notes: plan/notes/006.md

